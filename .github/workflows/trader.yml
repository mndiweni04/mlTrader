name: MLTrader Daily Run

on:
  workflow_dispatch: # Allows manual running
  schedule:
    # Runs at 06:00 UTC (which is 08:00 SAST), Monday-Friday
    - cron: '0 6 * * 1-5'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    # --- NEW: Give the job permissions to write back to the repo ---
    permissions:
      contents: write
    # --- END NEW ---

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 1. Install the C-library build dependencies
    - name: Install build-essential
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget

    # 2. Download and build TA-Lib from source
    - name: Download and Install TA-Lib C-Library
      run: |
        wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib/
        ./configure --prefix=/usr
        make
        sudo make install
      
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt 

    - name: Run Full ML Pipeline
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: |
        # Make the bash script executable
        chmod +x ./retrain_pipeline.sh
        # Run the bash script
        ./retrain_pipeline.sh
        
    # --- *** THIS IS THE NEW STEP *** ---
    # 3. Commit and push the updated trade log
    - name: Commit and Push Trade Log
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action-bot@github.com"
        git pull # Pull any recent changes first
        git add logs/live_trades_log.csv
        # Only commit if there are changes
        git diff-index --quiet HEAD || git commit -m "Bot: Update live trade log"
        git push
    # --- *** END NEW STEP *** ---