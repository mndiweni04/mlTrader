name: MLTrader Daily Run

on:
  workflow_dispatch: # Allows manual running
  schedule:
    - cron: '0 6 * * 1-5' # 06:00 UTC (08:00 SAST)

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 1. Install build dependencies
    - name: Install build-essential
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget

    # 2. Install TA-Lib C-Library
    - name: Download and Install TA-Lib C-Library
      run: |
        wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib/
        ./configure --prefix=/usr
        make
        sudo make install
      
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt 

    - name: Run Full ML Pipeline
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        # --- NEW: Pass Config Secrets ---
        ACCOUNT_CAPITAL: ${{ secrets.ACCOUNT_CAPITAL }}
        RISK_PER_TRADE_PCT: ${{ secrets.RISK_PER_TRADE_PCT }}
        # -------------------------------
      run: |
        chmod +x ./retrain_pipeline.sh
        ./retrain_pipeline.sh
        
    - name: Commit and Push Trade Log
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action-bot@github.com"
        git pull 
        git add logs/live_trades_log.csv
        git diff-index --quiet HEAD || git commit -m "Bot: Update live trade log"
        git push