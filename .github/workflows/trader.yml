name: MLTrader Daily Run

on:
  workflow_dispatch: # Allows manual running
  schedule:
    - cron: '30 21 * * 1-5' # Example: 9:30 PM UTC Mon-Fri

jobs:
  run-pipeline:
    runs-on: ubuntu-latest # Must be linux for this to work

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Match your local environment

    # --- *** THIS IS THE FIX *** ---
    # Use the Ubuntu package manager to install the TA-Lib development library
    - name: Install TA-Lib C-Library
      run: |
        sudo apt-get update
        sudo apt-get install -y ta-lib-dev
    # --- *** END FIX *** ---
      
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # pip install talib will now find the library installed by apt-get
        pip install -r requirements.txt 

    - name: Run Full ML Pipeline
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: |
        # Make the command file executable
        chmod +x ./retrain_command.txt
        # Run your command file
        ./retrain_command.txt