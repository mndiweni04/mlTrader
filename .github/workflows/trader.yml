name: MLTrader Daily Run

on:
  workflow_dispatch: # Allows manual running
  schedule:
    - cron: '30 21 * * 1-5' # Example: 9:30 PM UTC Mon-Fri

jobs:
  run-pipeline:
    runs-on: ubuntu-latest # Must be linux for this to work

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Match your local environment

    # --- THIS IS THE NEW STEP ---
    - name: Install TA-Lib C-Library
      run: |
        wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib/
        ./configure --prefix=/usr
        make
        sudo make install
      
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt # This will now find the C-library and succeed

    - name: Run Full ML Pipeline
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: |
        # Run your command file
        ./retrain_command.txt