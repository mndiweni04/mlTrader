name: MLTrader Daily Run

on:
  workflow_dispatch: # Allows manual running
  schedule:
    - cron: '30 21 * * 1-5' # 9:30 PM UTC Mon-Fri

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 1. Install the C-library build dependencies
    - name: Install build-essential
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget

    # 2. Download and build TA-Lib from source
    - name: Download and Install TA-Lib C-Library
      run: |
        wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib/
        ./configure --prefix=/usr
        make
        sudo make install
      
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt 

    - name: Run Full ML Pipeline
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: |
        # Make the new bash script executable
        chmod +x ./retrain_pipeline.sh
        # Run the new bash script
        ./retrain_pipeline.sh