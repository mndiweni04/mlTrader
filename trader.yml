# This is a GitHub Actions workflow file.
# It defines the "robot" that will run your bot.

name: ML Trader Bot - Daily Run

on:
  # 1. This makes it run on a schedule (at 20:00 UTC, which is 10 PM SAST)
  schedule:
    - cron: '0 20 * * *'
  
  # 2. This allows you to run it manually from the "Actions" tab on GitHub
  workflow_dispatch:

jobs:
  run-trader:
    runs-on: ubuntu-latest # Runs on a fresh Linux server

    steps:
      - name: 1. Check out the code
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Use a modern Python version

      - name: 3. Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 4. Run the full pipeline to create data and models
        # This runs every time to ensure data is fresh
        run: |
          python acquire_data.py
          python process_data.py
          python train_model.py
          python evaluate_model.py
      
      - name: 5. Run the Trader Bot
        env:
          # This securely loads the secrets you created in Step 1
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python run_trader.py